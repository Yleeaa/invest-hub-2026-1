name: 每日更新纳指限购数据

on:
  schedule:
    # 每天北京时间 09:30 运行（GitHub 用的是 UTC，比北京时间晚 8 小时）
    - cron: '30 1 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动点按钮运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install akshare pandas

      - name: 抓取数据并生成 data.json
        run: python fetch_data.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "数据无变化" || (git commit -m "chore: 更新纳指限购数据" && git push)
